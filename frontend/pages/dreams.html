<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somnia — 📝 Нотатки</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") || "light";
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/forms.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-moon">🌙</span>
          <div>
            <h2>SOMNIA</h2>
            <p>TRACKER</p>
          </div>
        </div>
        <nav>
          <a href="../index.html">🏠 Головна</a>
          <a href="./calendar.html">📅 Календар</a>
          <a href="./analytics.html">📊 Статистика</a>
          <a href="./goals.html">🎯 Цілі</a>
          <a href="./dreams.html" class="active">📝 Нотатки</a>
          <a href="./history.html">📖 Історія</a>
          <a href="./settings.html">⚙️ Налаштування</a>
          <a href="./profile.html">👤 Профіль</a>
        </nav>
      </aside>
      <div class="overlay" id="overlay"></div>
      <div class="page">
        <header class="header">
          <button class="menu-button" aria-label="Меню">✨</button>
          <div class="logo">
            <h1>SOMNIA</h1>
            <p>TRACKER</p>
          </div>
          <a
            href="./profile.html"
            class="profile-button"
            style="display: flex; align-items: center; justify-content: center"
            >👩</a
          >
        </header>
        <main>
          <div class="page-title">
            <h2>📝 Нотатки</h2>
            <p>Сни та думки про твій сон</p>
          </div>
          <input
            class="search"
            id="notesSearch"
            type="search"
            placeholder="🔍 Пошук за нотатками"
          />
          <!-- Нотатки малює js/dreams.js -->
          <div class="list" id="notesList"></div>
          <p style="text-align: center; margin-top: 18px">
            <a href="./note-new.html" class="btn">➕ Нова нотатка</a>
          </p>
        </main>
      </div>
    </div>
    <nav class="bottom-nav">
      <a href="../index.html"><span>🏠</span>Головна</a>
      <a href="./calendar.html"><span>📅</span>Календар</a>
      <button type="button" class="plus">➕</button>
      <a href="./analytics.html"><span>📊</span>Статистика</a>
      <a href="./settings.html"><span>⚙️</span>Налаштування</a>
    </nav>

    <div class="modal" id="noteModal">
      <div class="modal-content">
        <h2>✏️ Редагувати нотатку</h2>
        <textarea id="noteModalDream" rows="4" placeholder="💭 Сон"></textarea>
        <textarea
          id="noteModalNote"
          rows="4"
          placeholder="📝 Нотатка"
        ></textarea>
        <button type="button" class="save-sleep" id="noteModalSave">
          Зберегти
        </button>
        <button type="button" class="close-modal" id="noteModalClose">
          Закрити
        </button>
      </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/dreams.js"></script>
  </body>
</html>
