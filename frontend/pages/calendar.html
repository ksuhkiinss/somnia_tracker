<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somnia — 📅 Календар</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") || "light";
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/forms.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-moon">🌙</span>
          <div>
            <h2>SOMNIA</h2>
            <p>TRACKER</p>
          </div>
        </div>
        <nav>
          <a href="../index.html">🏠 Головна</a>
          <a href="./calendar.html" class="active">📅 Календар</a>
          <a href="./analytics.html">📊 Статистика</a>
          <a href="./goals.html">🎯 Цілі</a>
          <a href="./dreams.html">📝 Нотатки</a>
          <a href="./history.html">📖 Історія</a>
          <a href="./settings.html">⚙️ Налаштування</a>
          <a href="./profile.html">👤 Профіль</a>
        </nav>
      </aside>
      <div class="overlay" id="overlay"></div>
      <div class="page">
        <header class="header">
          <button class="menu-button" aria-label="Меню">✨</button>
          <div class="logo">
            <h1>SOMNIA</h1>
            <p>TRACKER</p>
          </div>
          <a
            href="./profile.html"
            class="profile-button"
            style="display: flex; align-items: center; justify-content: center"
            >👩</a
          >
        </header>
        <main>
          <div class="page-title">
            <h2>📅 Календар</h2>
            <p>Переглядай свій сон за кожен день</p>
          </div>

          <div class="card">
            <div class="cal-head">
              <button
                type="button"
                id="prevMonth"
                aria-label="Попередній місяць"
              >
                ‹
              </button>
              <h3 id="currentMonth"></h3>
              <button
                type="button"
                id="nextMonth"
                aria-label="Наступний місяць"
              >
                ›
              </button>
            </div>
            <div class="cal-grid" id="calendarGrid">
              <div class="wd">Пн</div>
              <div class="wd">Вт</div>
              <div class="wd">Ср</div>
              <div class="wd">Чт</div>
              <div class="wd">Пт</div>
              <div class="wd">Сб</div>
              <div class="wd">Нд</div>
            </div>
            <div class="legend">
              <span><i style="background: #4caf6a"></i>Ціль виконана</span
              ><span><i style="background: var(--star)"></i>Трохи менше</span
              ><span><i style="background: #e5736f"></i>Мало сну</span>
            </div>
          </div>

          <div class="card" id="selectedDay"></div>
        </main>
      </div>
    </div>
    <nav class="bottom-nav">
      <a href="../index.html"><span>🏠</span>Головна</a>
      <a href="./calendar.html" class="active"><span>📅</span>Календар</a>
      <button type="button" class="plus">➕</button>
      <a href="./analytics.html"><span>📊</span>Статистика</a>
      <a href="./settings.html"><span>⚙️</span>Налаштування</a>
    </nav>

    <script src="../js/common.js"></script>
    <script src="../js/calendar.js"></script>
  </body>
</html>
